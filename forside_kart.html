<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fagløpet – kart</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="components.css">
</head>
<body class="side-app">

  <div class="app">

    <!-- Sidemeny og header (fra komponenter.js) -->
    <div data-komponent="sidemeny"></div>
    <div data-komponent="header"></div>

    <!-- Kartet (kan dras rundt) -->
    <main class="kart-visning" tabindex="0" aria-label="Kart over Fagløpet. Dra med musen eller bruk piltastene for å se deg rundt.">
      <img class="kart-bilde" src="bilder/kart.png" alt="Fargerikt kart over Bergen med en svingete sti opp til huset på toppen av fjellet" draggable="false">
    </main>

  </div>

  <script src="komponenter.js"></script>
  <script src="kartet.js"></script>
</body>
</html>
