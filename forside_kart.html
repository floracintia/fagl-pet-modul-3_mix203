<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fagløpet – kart</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="components.css">
</head>
<body class="side-app">

  <div class="app">

    <!-- Sidemeny og header (fra komponenter.js) -->
    <div data-komponent="sidemeny"></div>
    <div data-komponent="header"></div>

    <!-- Kartet (kan dras rundt) -->
    <main class="kart-visning" tabindex="0" aria-label="Kart over Fagløpet. Dra med musen eller bruk piltastene for å se deg rundt.">
      <div class="kart-lag">
        <img class="kart-bilde" src="bilder/kart.png" alt="Fargerikt kart over Bergen med en svingete sti opp til huset på toppen av fjellet" draggable="false">

        <!-- GameStop: Del artikkel i arkivet. --x/--y = plassering i prosent av kartbildet (i gresset ved Fløyen) -->
        <div class="gamestop-stopp" style="--x: 72.2%; --y: 32.1%;">
        <a class="gamestop" href="bibliotek.html" aria-label="Del artikkel i arkivet" draggable="false">
          <span class="gamestop-ring"></span>
          <span class="gamestop-skygge"></span>
          <span class="gamestop-knapp">
            <span class="gamestop-indre">
              <img class="gamestop-ikon-liten" src="bilder/ikoner/poll.svg" width="31" height="31" alt="">
              <img class="gamestop-ikon-stor" src="bilder/ikoner/poll-stor.svg" width="31" height="31" alt="">
            </span>
          </span>
        </a>

        <!-- Infoboks som vises til høyre ved hover -->
        <div class="gamestop-kort">
          <div class="kort">
            <span class="kort-ikon">
              <img src="bilder/ikoner/poll-kort.svg" width="36" height="36" alt="">
            </span>
            <p class="kort-etikett">Nytt spill</p>
            <h2 class="kort-tittel">Hva mener du?</h2>
            <p class="kort-tekst">Stem på ukens spørsmål og se hva resten av kontoret mener.</p>
            <a class="kort-knapp" href="#" draggable="false">
              Spill nå
              <img src="bilder/ikoner/pil-hoyre.svg" width="20" height="20" alt="">
            </a>
            <button class="kort-lukk" type="button" aria-label="Lukk">
              <img src="bilder/ikoner/lukk.svg" width="18" height="18" alt="">
            </button>
          </div>
        </div>
        </div>

        <!-- GameStop: Quiz (lilla). I gresset ytterst ved svingen nederst på stien -->
        <div class="gamestop-stopp" style="--x: 36.85%; --y: 84.7%;">
          <a class="gamestop gamestop--quiz" href="#" aria-label="Quiz" draggable="false">
            <span class="gamestop-ring"></span>
            <span class="gamestop-skygge"></span>
            <span class="gamestop-knapp">
              <span class="gamestop-indre">
                <span class="gamestop-tegn" aria-hidden="true">?</span>
              </span>
            </span>
          </a>

          <!-- Infoboks som vises ved hover -->
          <div class="gamestop-kort">
            <div class="kort kort--quiz">
              <span class="kort-ikon">
                <span class="kort-ikon-tegn" aria-hidden="true">?</span>
              </span>
              <p class="kort-etikett">Test dine ferdigheter</p>
              <h2 class="kort-tittel">Ukens quiz</h2>
              <p class="kort-tekst">Fire kjappe spørsmål.</p>
              <a class="kort-knapp" href="#" draggable="false">
                Spill nå
                <img src="bilder/ikoner/pil-hoyre.svg" width="20" height="20" alt="">
              </a>
              <button class="kort-lukk" type="button" aria-label="Lukk">
                <img src="bilder/ikoner/lukk.svg" width="18" height="18" alt="">
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

  </div>

  <script src="komponenter.js"></script>
  <script src="kartet.js"></script>
</body>
</html>
